name: plant_disease_detector
description: "AI-powered plant disease detection app using Claude Vision API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for Claude API calls
  http: ^1.2.0

  # Camera & gallery image picking
  image_picker: ^1.0.7

  # Save API key locally on device
  shared_preferences: ^2.2.3

  # Camera & storage permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true